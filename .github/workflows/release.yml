name: Release (Changesets 🦋)

on:
    workflow_dispatch:
    push:
        branches:
            - main

env:
    CI: true
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# The "Auto-Merge Changeset PR" step below ends with `gh workflow run release.yml`
# AND merging that PR is itself a push to main, so two runs fire on the same
# commit. Both then run `ci:publish`; the loser dies with
# "E403 You cannot publish over the previously published versions", leaving a red
# Release run for a release that actually succeeded. Serialise them instead.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
            actions: write
        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GH_PAT }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'

            - name: Setup uv
              uses: astral-sh/setup-uv@v6

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      rust/fetch -> rust/fetch/target
                  cache-on-failure: true

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.23'
                  cache-dependency-path: go/fetch/go.sum

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Install dependencies
              run: pnpm install

            - name: Sync Python dependencies
              run: uv sync --group dev
              working-directory: python

            - name: Restore .NET dependencies
              run: dotnet restore SmooAI.Fetch.sln
              working-directory: dotnet

            - name: Version consistency
              run: pnpm version:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            # Deliberately a CHECK, not `pnpm format`. A formatter that rewrites
            # files here leaves the tree dirty at `cargo publish` time, which is
            # what `--allow-dirty` used to hide. Formatting the release commit
            # itself is `version:release`'s job.
            - name: Format check
              run: pnpm format:check && pnpm python:format:check && pnpm rust:fmt:check && pnpm go:fmt:check && pnpm dotnet:format:check

            - name: Version Update 🦋
              id: changesets
              uses: changesets/action@v1
              with:
                  commit: '🦋 New version release'
                  title: '🦋 New version release'
                  version: pnpm run version:release
                  publish: pnpm ci:publish
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                  NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

            - name: Publish smooai-fetch to PyPI
              if: steps.changesets.outputs.hasChangesets == 'false'
              working-directory: python
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.SMOOAI_PYPI_TOKEN }}
              run: |
                  # Clean stale build artifacts from the earlier `pnpm build` run
                  # (which produced wheels at the pre-sync version) so `uv publish`
                  # doesn't try to upload the stale files alongside the fresh ones.
                  rm -rf dist/
                  uv run poe publish

            - name: Publish smooai-fetch to crates.io
              if: steps.changesets.outputs.hasChangesets == 'false'
              # No --allow-dirty: sync-versions.mjs now runs during `changeset
              # version`, so the manifests are already committed and the tree is
              # clean here. If this ever fails on dirt, something upstream is
              # rewriting files during the release — fix that, don't re-add the flag.
              run: |
                  # Tolerate ONLY "already exists" so a rerun is a no-op; any other
                  # failure still reds the run.
                  if ! out=$(cargo publish --locked --manifest-path rust/fetch/Cargo.toml 2>&1); then
                      echo "$out"
                      echo "$out" | grep -q 'already exists' || exit 1
                      echo "Version already on crates.io — nothing to do."
                  fi
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.SMOOAI_CARGO_REGISTRY_TOKEN }}

            - name: Tag and publish Go module
              if: steps.changesets.outputs.hasChangesets == 'false'
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="go/fetch/v${VERSION}"
                  echo "Creating Go module tag: ${TAG}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                      echo "Tag ${TAG} already exists — nothing to do."
                  else
                      git tag "${TAG}"
                      git push origin "${TAG}"
                      echo "Go module tagged and pushed: ${TAG}"
                  fi

            - name: Pack and publish SmooAI.Fetch to NuGet
              if: steps.changesets.outputs.hasChangesets == 'false'
              run: |
                  dotnet pack SmooAI.Fetch/SmooAI.Fetch.csproj -c Release --nologo -o ./artifacts
                  dotnet nuget push "./artifacts/*.nupkg" \
                      --api-key "${NUGET_API_KEY}" \
                      --source "https://api.nuget.org/v3/index.json" \
                      --skip-duplicate
              working-directory: dotnet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

            - name: Verify the release actually landed
              if: steps.changesets.outputs.hasChangesets == 'false'
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "Verifying ${VERSION} is live on every registry..."
                  fail=0
                  npm view "@smooai/fetch@${VERSION}" version >/dev/null 2>&1 \
                      || { echo "::error::npm has no ${VERSION}"; fail=1; }
                  curl -sfI "https://pypi.org/pypi/smooai-fetch/${VERSION}/json" >/dev/null \
                      || { echo "::error::PyPI has no ${VERSION}"; fail=1; }
                  curl -sf -H 'User-Agent: smooai-release (brent@smoo.ai)' \
                      "https://crates.io/api/v1/crates/smooai-fetch/${VERSION}" >/dev/null \
                      || { echo "::error::crates.io has no ${VERSION}"; fail=1; }
                  git ls-remote --exit-code --tags origin "refs/tags/go/fetch/v${VERSION}" >/dev/null 2>&1 \
                      || { echo "::error::no go/fetch/v${VERSION} tag"; fail=1; }
                  # NuGet is deliberately not checked: its validation pipeline lags
                  # by minutes, so asserting on it here would flake.
                  if [ "$fail" -ne 0 ]; then
                      echo "::error::Release reported success but did not reach every registry. Re-run this workflow — the publish steps are idempotent."
                      exit 1
                  fi
                  echo "All registries carry ${VERSION}."

            - name: Auto-Merge Changeset PR
              run: |
                  PR_NUMBER=$(gh pr list --state open --head changeset-release/main --json number --jq '.[0].number')

                  if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
                    echo "Found Changeset PR #$PR_NUMBER, attempting to auto-merge..."
                    gh pr merge "$PR_NUMBER" --auto --squash
                    
                    # Re-trigger the Release workflow
                    echo "Re-triggering the release workflow..."
                    gh workflow run release.yml
                  else
                    echo "No open Changeset PR found, skipping merge."
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}
