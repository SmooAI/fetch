name: PR Checks

# One job per language, deliberately.
#
# This used to be a single serial `validate` job that ran typecheck -> lint ->
# format -> test -> build across all five ports in sequence. The first failure
# ended the run, so a Rust compile error meant the Go, Python and .NET lanes
# never reported at all — the log said "validate: fail" and a reviewer had to
# open it to learn which of five languages was actually broken. Splitting them
# means every lane reports its own verdict, and the run is only as slow as its
# slowest language instead of the sum of all of them.
#
# No path filtering: the shared fixtures under `spec/` are consumed by several
# languages at once, so every filter would have to list them, and a filter that
# forgets one silently skips that language. That is the same fail-open shape
# these checks exist to catch, so every lane runs on every PR.

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    # Cheapest lane, no language toolchain — fails fast when a release manifest
    # has drifted from package.json.
    versions:
        name: Versions
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Version consistency
              run: node scripts/sync-versions.mjs --check

    typescript:
        name: TypeScript
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Locate pnpm store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

            - name: Cache pnpm store
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-store-

            - run: pnpm install
            - name: Typecheck
              run: pnpm ts:typecheck
            - name: Lint
              run: pnpm ts:lint
            # oxfmt covers every file in the repo, not just TypeScript, so it
            # belongs to exactly one job rather than each language's.
            - name: Format check
              run: pnpm ts:format:check
            - name: Test
              run: pnpm ts:test
            - name: Build
              run: pnpm ts:build

    python:
        name: Python
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: python
        steps:
            - uses: actions/checkout@v4
            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - run: uv sync --group dev
            - name: Typecheck
              run: uv run poe typecheck
            - name: Lint
              run: uv run poe lint
            - name: Format check
              run: uv run poe format:check
            - name: Test
              run: uv run poe test
            - name: Build
              run: uv run poe build

    rust:
        name: Rust
        runs-on: ubuntu-latest
        timeout-minutes: 25
        defaults:
            run:
                working-directory: rust/fetch
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: rust/fetch -> rust/fetch/target
                  cache-on-failure: true
            - name: Format check
              run: cargo fmt --all -- --check
            # --all-features throughout: the `otel` integration is optional, and
            # a bare `cargo test` never compiles tests/trace_propagation_tests.rs
            # (it is behind `#![cfg(feature = "otel")]`), reporting "0 passed; ok"
            # for three real tests that were therefore invisible to CI.
            - name: Lint
              run: cargo clippy --all-targets --all-features -- -D warnings
            - name: Test (default features)
              run: cargo test
            - name: Test (all features)
              run: cargo test --all-features
            - name: Build
              run: cargo build --release

    go:
        name: Go
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: go/fetch
        steps:
            - uses: actions/checkout@v4
            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Format check
              run: test -z "$(gofmt -l .)"
            - name: Vet
              run: go vet ./...
            # -count=1 disables the test cache. Go's cache does NOT invalidate on a
            # fixture read from OUTSIDE the package directory, and this suite loads
            # spec/connect-timeout-corpus.json from the repo root — so a corrupted
            # corpus returned "ok (cached)" and the lane proved nothing. Verified by
            # hand: corrupt the corpus, `go test` says cached/ok, `-count=1` fails.
            - name: Test
              run: go test -count=1 -v ./...
            - name: Build
              run: go build ./...

    dotnet:
        name: .NET
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: dotnet
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x
            - run: dotnet restore SmooAI.Fetch.sln
            - name: Format check
              run: dotnet format SmooAI.Fetch.sln --verify-no-changes
            - name: Test
              run: dotnet test SmooAI.Fetch.sln -c Release --nologo
            - name: Build
              run: dotnet build SmooAI.Fetch.sln -c Release --nologo
